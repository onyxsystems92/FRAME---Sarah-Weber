  - name: "team"
    label: "Team"
    editor: { preview: false }
    label_singular: "Teammitglied"
    folder: "src/team"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{role}}"
    fields:
      - { label: "Name", name: "name", widget: "string", required: false, hint: "Leer lassen, solange die Person noch nicht vorgestellt werden soll; dann erscheint nur die Rolle." }
      - { label: "Rolle / Funktion", name: "role", widget: "string" }
      - { label: "Hervorgehobenes Profil (große Vorstellung, z. B. Praxisinhaberin)", name: "featured", widget: "boolean", default: false }
      - { label: "Zusatz über dem Namen (nur bei hervorgehobenem Profil)", name: "eyebrow", widget: "string", required: false, hint: "z. B. Praxisinhaberin" }
      - { label: "Reihenfolge (kleinere Zahl erscheint zuerst)", name: "order", widget: "number", default: 9, value_type: "int" }
      - { label: "Foto", name: "photo", widget: "image", required: false, hint: "Leer lassen zeigt einen ruhigen Platzhalter statt eines Fotos." }
      - { label: "Alternativtext für das Foto", name: "photoAlt", widget: "string", required: false }
      - { label: "Qualifikationen", name: "qualifications", widget: "list", required: false, hint: "Mehrere Qualifikationen durch Komma trennen." }
      - { label: "Kurzbiografie", name: "body", widget: "markdown", required: false }
      - { label: "tags", name: "tags", widget: "hidden", default: ["team"] }

  - name: "aktuelles"
    label: "Aktuelles"
    editor: { preview: false }
    label_singular: "Hinweis"
    folder: "src/aktuelles"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{status}}"
    fields:
      - { label: "Eindeutige ID", name: "id", widget: "string", hint: "z. B. ferien-winter-2026 — einmal vergeben, danach nicht mehr ändern." }
      - { label: "Status", name: "status", widget: "select", options: [{ label: "Entwurf (nicht sichtbar)", value: "draft" }, { label: "Veröffentlicht", value: "published" }], default: "draft" }
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Text", name: "text", widget: "text" }
      - { label: "Veröffentlichen ab", name: "publishedAt", widget: "datetime", format: "yyyy-MM-dd", date_format: "dd.MM.yyyy", time_format: false, hint: "Vor diesem Tag ist der Hinweis nicht zu sehen." }
      - { label: "Läuft ab am", name: "expiresAt", widget: "datetime", format: "yyyy-MM-dd", date_format: "dd.MM.yyyy", time_format: false, required: false, default: "", hint: "Leer lassen, wenn der Hinweis unbegrenzt gelten soll. Nach diesem Tag verschwindet er automatisch." }
      - { label: "Auch auf der Startseite zeigen (max. 2 werden dort angezeigt)", name: "showOnHomepage", widget: "boolean", default: false }
      - { label: "tags", name: "tags", widget: "hidden", default: ["aktuelles"] }
