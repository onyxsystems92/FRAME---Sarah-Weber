        label: "Praxisbesuch"
        file: "src/_data/copy/praxis.yaml"
        fields:
          - name: "hero"
            label: "Kopfbereich"
            widget: "object"
            collapsed: false
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "contact"
            label: "Kontakt & Termin"
            widget: "object"
            collapsed: true
