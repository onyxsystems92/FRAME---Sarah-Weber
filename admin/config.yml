            widget: "object"
            collapsed: true
            hint: "Die fünf Kontexte sind feste Sprungziele (z. B. therapie.html#sport). Texte frei änderbar, Anzahl fest."
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
