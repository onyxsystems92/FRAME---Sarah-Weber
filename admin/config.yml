      - name: "fusszeile"
        label: "Fußzeile (alle Seiten)"
        file: "src/_data/copy/global.yaml"
        fields:
          - name: "footer"
            label: "Fußzeile"
            widget: "object"
            collapsed: false
            fields:
              - label: "Kurzbeschreibung der Praxis"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Zeile ganz unten rechts"
                name: "bottomLine"
                widget: "string"

  - name: "praxis"
    label: "Praxis-Angaben"
    editor: { preview: false }
    files:
      - name: "stammdaten"
        label: "Kontakt & Adresse"
        file: "src/_data/site.yaml"
        fields:
          - { label: "Telefonnummer (Anzeige)", name: "phoneDisplay", widget: "string" }
          - { label: "Telefonnummer (Link, Format tel:+49...)", name: "phoneHref", widget: "string" }
          - { label: "Adresse Zeile 1", name: "addressLine1", widget: "string" }
          - { label: "Adresse Zeile 2", name: "addressLine2", widget: "string" }
          - { label: "Postleitzahl bestätigt?", name: "postcodeConfirmed", widget: "boolean", default: false }
          - { label: "Google-Maps-Link", name: "mapsUrl", widget: "string" }
          - { label: "E-Mail bestätigt?", name: "emailConfirmed", widget: "boolean", default: false }
          - { label: "E-Mail-Adresse", name: "email", widget: "string", required: false }
          - { label: "Termin-Link bestätigt?", name: "appointmentUrlConfirmed", widget: "boolean", default: false }
          - { label: "Termin-Link (URL)", name: "appointmentUrl", widget: "string", required: false }
          # Technische Werte: im Editor unsichtbar, bleiben beim Speichern erhalten.
          - { label: "Name", name: "name", widget: "hidden" }
          - { label: "Wortmarke", name: "wordmark", widget: "hidden" }
          - { label: "Kurzbeschreibung", name: "tagline", widget: "hidden" }
          - { label: "Suchmaschinen", name: "robots", widget: "hidden" }

  - name: "praxisbilder"
