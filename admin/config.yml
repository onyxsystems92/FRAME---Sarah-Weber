              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - name: "items"
                label: "Aufklappbare Punkte"
                label_singular: "Punkt"
                widget: "list"
                summary: "{{fields.title}}"
                min: 1
                max: 6
                fields:
                  - label: "Titel"
                    name: "title"
                    widget: "string"
                  - label: "Text beim Aufklappen"
