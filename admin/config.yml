backend:
  name: proxy
  proxy_url: "http://localhost:8081/api/v1"

local_backend: true

# One shared media library for every upload (photos, portraits). Paths are
# relative to the project; the site links them relatively as images/<name>.
media_folder: "src/images"
public_folder: "images"

publish_mode: simple

# Editor interface in German.
locale: "de"

# New file names use plain ASCII (no umlauts or symbols), so they survive
# any upload tool and server.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "seiten"
    label: "Seiteninhalte"
    editor: { preview: false }
    description: "Alle Texte der sieben Seiten, nach Seite und Bereich geordnet. Aufbau, Farben und Verlinkung bleiben geschützt."
    files:
      - name: "startseite"
        label: "Startseite"
        file: "src/_data/copy/home.yaml"
        fields:
          - name: "hero"
            label: "Kopfbereich"
            widget: "object"
            collapsed: false
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "orientation"
            label: "Grüner Orientierungskasten"
            widget: "object"
            collapsed: true
            hint: "Die vier Besucherwege und ihre Ziele sind fest vorgegeben und nicht hier bearbeitbar."
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "practiceBand"
            label: "Praxisband unter dem Foto"
            widget: "object"
            collapsed: true
            fields:
              - label: "Text rechts neben der Adresse"
                name: "text"
                widget: "string"
          - name: "values"
            label: "Bereich „Was uns prägt“"
            widget: "object"
            collapsed: true
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Text neben dem Logo"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Name unter dem Porträt"
                name: "portraitName"
                widget: "string"
              - label: "Zeile unter dem Namen"
                name: "portraitLine"
                widget: "string"
          - name: "destinations"
            label: "Kurztexte der sechs Seitenkarten"
            widget: "object"
            collapsed: true
            fields:
              - label: "Arbeitsweise"
                name: "arbeitsweise"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Therapie"
                name: "therapie"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Team"
                name: "team"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Praxisbesuch"
                name: "praxis"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Karriere"
                name: "karriere"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - label: "Aktuelles"
                name: "aktuelles"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "updates"
            label: "Hinweisbereich (nur sichtbar, wenn ein Hinweis für die Startseite freigegeben ist)"
            widget: "object"
            collapsed: true
            fields:
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Beschriftung des Links zur Aktuelles-Seite"
                name: "link"
                widget: "string"
          - name: "treatments"
            label: "Behandlungskontexte (grüner Bereich)"
            widget: "object"
            collapsed: true
            hint: "Titel und Kurzbeschreibungen der fünf Kontexte bearbeiten Sie unter „Therapie“."
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "cta"
            label: "Abschluss (grüner Kasten)"
            widget: "object"
            collapsed: true
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Text (optional)"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
                required: false
              - label: "Beschriftung des Buttons"
                name: "button"
                widget: "string"
      - name: "arbeitsweise"
        label: "Arbeitsweise"
        file: "src/_data/copy/arbeitsweise.yaml"
        fields:
          - name: "hero"
            label: "Kopfbereich"
            widget: "object"
            collapsed: false
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "facts"
            label: "Vier Kennzeichen unter dem Kopfbereich"
            label_singular: "Kennzeichen"
            widget: "list"
            summary: "{{fields.value}}"
            min: 4
            max: 4
            allow_add: false
            hint: "Genau vier Einträge; das Layout ist vierspaltig."
            fields:
              - label: "Kurzwort oder Zahl"
                name: "value"
                widget: "string"
              - label: "Erläuterung"
                name: "text"
                widget: "string"
          - name: "method"
            label: "Ablauf „Wahrnehmen, einordnen, entscheiden“"
            widget: "object"
            collapsed: true
            fields:
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Einleitung"
                name: "intro"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - name: "steps"
                label: "Schritte"
                label_singular: "Schritt"
                widget: "list"
                summary: "{{fields.label}}: {{fields.title}}"
                min: 3
                max: 3
                allow_add: false
                hint: "Genau drei Schritte; sie werden als Abfolge verbunden."
                fields:
                  - label: "Stichwort (klein, über dem Titel)"
                    name: "label"
                    widget: "string"
                  - label: "Titel"
                    name: "title"
                    widget: "string"
                  - label: "Text"
                    name: "text"
                    widget: "text"
                    hint: "Leerzeile = neuer Absatz."
          - name: "time"
            label: "Bereich „Mehr Zeit“ (grün)"
            widget: "object"
            collapsed: true
            fields:
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Text unter der Überschrift"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
              - name: "points"
                label: "Absätze rechts"
                label_singular: "Absatz"
                widget: "list"
                summary: "{{fields.title}}"
                min: 1
                max: 5
                fields:
                  - label: "Zwischenüberschrift"
                    name: "title"
                    widget: "string"
                  - label: "Text"
                    name: "text"
                    widget: "text"
                    hint: "Leerzeile = neuer Absatz."
          - name: "cta"
            label: "Abschluss (grüner Kasten)"
            widget: "object"
            collapsed: true
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Text (optional)"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
                required: false
              - label: "Beschriftung des Buttons"
                name: "button"
                widget: "string"
