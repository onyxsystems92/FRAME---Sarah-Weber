                  - label: "Kurzbeschreibung (Startseite)"
                    name: "summary"
                    widget: "string"
                  - label: "Ausführlicher Text (Therapieseite, aufklappbar)"
                    name: "text"
                    widget: "text"
                    hint: "Leerzeile = neuer Absatz."
              - name: "neurologie"
                label: "Neurologie"
                widget: "object"
                collapsed: true
                fields:
                  - label: "Titel (Therapieseite)"
                    name: "title"
                    widget: "string"
                  - label: "Kurztitel (Startseite)"
                    name: "shortTitle"
                    widget: "string"
                  - label: "Kurzbeschreibung (Startseite)"
                    name: "summary"
                    widget: "string"
                  - label: "Ausführlicher Text (Therapieseite, aufklappbar)"
                    name: "text"
                    widget: "text"
                    hint: "Leerzeile = neuer Absatz."
              - name: "cmd"
                label: "Kiefer / CMD"
                widget: "object"
                collapsed: true
                fields:
                  - label: "Titel (Therapieseite)"
                    name: "title"
                    widget: "string"
                  - label: "Kurztitel (Startseite)"
                    name: "shortTitle"
                    widget: "string"
                  - label: "Kurzbeschreibung (Startseite)"
                    name: "summary"
                    widget: "string"
                  - label: "Ausführlicher Text (Therapieseite, aufklappbar)"
                    name: "text"
                    widget: "text"
                    hint: "Leerzeile = neuer Absatz."
              - name: "beckenboden"
                label: "Beckenboden"
                widget: "object"
                collapsed: true
                fields:
                  - label: "Titel (Therapieseite)"
                    name: "title"
                    widget: "string"
                  - label: "Kurztitel (Startseite)"
                    name: "shortTitle"
                    widget: "string"
                  - label: "Kurzbeschreibung (Startseite)"
                    name: "summary"
                    widget: "string"
                  - label: "Ausführlicher Text (Therapieseite, aufklappbar)"
                    name: "text"
                    widget: "text"
                    hint: "Leerzeile = neuer Absatz."
          - name: "methods"
            label: "Methoden und Qualifikationen (grün)"
            widget: "object"
            collapsed: true
            fields:
              - label: "Überschrift des Bereichs"
                name: "title"
                widget: "string"
              - label: "Überschrift der Liste"
                name: "listTitle"
                widget: "string"
              - name: "items"
                label: "Methoden und Qualifikationen"
                label_singular: "Methode"
                widget: "list"
                summary: "{{fields.name}}"
                min: 1
                hint: "Nur fachlich bestätigte Methoden eintragen."
                fields:
                  - label: "Methode"
                    name: "name"
                    widget: "string"
              - label: "Überschrift des Hinweises"
                name: "noteTitle"
                widget: "string"
              - label: "Hinweistext"
                name: "noteText"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
          - name: "cta"
            label: "Abschluss (grüner Kasten)"
            widget: "object"
            collapsed: true
            fields:
              - label: "Kleine Zeile über der Überschrift"
                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Text (optional)"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
                required: false
              - label: "Beschriftung des Buttons"
                name: "button"
                widget: "string"
      - name: "team"
        label: "Team (Seitentexte)"
        file: "src/_data/copy/team.yaml"
        fields:
          - name: "hero"
            label: "Kopfbereich"
            widget: "object"
            collapsed: false
