                name: "kicker"
                widget: "string"
              - label: "Überschrift"
                name: "title"
                widget: "string"
              - label: "Text (optional)"
                name: "text"
                widget: "text"
                hint: "Leerzeile = neuer Absatz."
                required: false
              - label: "Beschriftung des Buttons"
                name: "button"
                widget: "string"
