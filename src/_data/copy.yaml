# Sarah-editierbare Titel und Einleitungen (alle sieben Seiten).
home:
  title: "Physiotherapie mit Zeit, Zusammenhänge wirklich zu verstehen."
  intro: "Raum und Zeit verbindet persönliche therapeutische Begleitung mit funktionellem Denken und fachlicher Tiefe. Wählen Sie den Einstieg, der zu Ihrer Situation passt."
arbeitsweise:
  title: "Verstehen, bevor behandelt wird."
  intro: "Zeit ist bei Raum und Zeit kein dekoratives Versprechen. Sie schafft den Rahmen, um Befund, funktionelle Zusammenhänge, Behandlung und Reaktion gemeinsam zu betrachten."
therapie:
  title: "Methoden sind Werkzeuge. Entscheidend ist der Zusammenhang."
  intro: "Diese Seite gibt Orientierung über häufige Behandlungskontexte. Sie ersetzt keine individuelle Befundung und trifft keine Diagnose oder automatische Therapiezuordnung."
team:
  title: "Persönlich genug, um Entwicklung zu sehen."
  intro: "Raum und Zeit versteht therapeutische Kontinuität als Teil der Qualität. Menschen sollen wissen, wer sie begleitet, nicht nur welche Qualifikationen an der Wand stehen."
praxis:
  title: "Ankommen und wissen, was wichtig ist."
  intro: "Kontakt, Terminweg und organisatorische Informationen gehören an einen Ort. Die Website soll möglichst viele einfache Orientierungsfragen beantworten, ohne persönliche Beratung dort zu ersetzen, wo sie wirklich nötig ist."
karriere:
  title: "Therapie braucht Zeit. Gute Arbeit auch."
  intro: "Raum und Zeit möchte wachsen, ohne die eigene Arbeitsweise zu verlieren. Die Karriereseite macht deshalb nicht nur eine Stelle sichtbar, sondern den professionellen Kontext, in dem hier gearbeitet wird."
aktuelles:
  title: "Aktuelles aus der Praxis."
  intro: "Hier finden Sie Hinweise zu Erreichbarkeit, Praxisablauf, Team oder anderen Veränderungen, die für Ihren Besuch relevant sind."
