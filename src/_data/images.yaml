# Praxis-Bildplätze. Jeder Platz hat ein festes Seitenverhältnis, damit ein
# späteres echtes Foto ohne Layoutumbau eingesetzt werden kann.
#
# src    leer  = gestalteter, klar gekennzeichneter Platzhalter
#        gefüllt = echtes Foto (Pfad relativ zur Website, z. B. images/praxis/raum.jpg)
# alt    Bildbeschreibung für Screenreader. Pflicht, sobald src gesetzt ist.
# focus  Bildausschnitt bei beschnittenen Formaten (CSS object-position),
#        z. B. "center center", "center 30%", "left top".
# note   Was dieses Bild zeigen soll. Steht im Platzhalter, nie im fertigen Bild.

